<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Años de Servicio</title>
    <link rel="icon" type="image/png" href="images/DIRTIC.png">
    
    <script src="https://cdn.tailwindcss.com"></script> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="cas.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="contenedor-principal">
        <section class="panel-calculadora">
            
            <h2 class="titulo-herramienta">
                <i class="fas fa-calculator"></i> Calculadora Años de Servicio.
            </h2>
            <p class="subtitulo-instruccion">Ingrese los periodos para calcular el tiempo total acumulado.</p>

            <div id="lista-de-periodos" class="space-y-4"></div>

            <div class="flex flex-col sm:flex-row gap-4 mt-8">
                <button onclick="agregarPeriodo()" class="boton-secundario">
                    + Agregar otro periodo
                </button>
                <button onclick="realizarCalculo()" class="boton-principal">
                    Calcular Tiempo Total
                </button>
            </div>

            <div id="seccion-resultados" class="hidden mt-10 border-t pt-8">
                <div id="desglose-individual" class="space-y-2 mb-6"></div>
                
                <div id="bloque-total" class="cuadro-resultado-final"></div>
                
                <div class="flex justify-center mt-8">
                    <button onclick="reiniciarCalculadora()" class="boton-reiniciar">
                        BORRAR Y REINICIAR
                    </button>
                </div>
            </div>

            <div id="error-alerta" class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded-lg border border-red-200"></div>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="menu-toggle.js"></script>
    <script src="include.js"></script>

    <script>
        let contador = 0;

        // Iniciar con un periodo al cargar
        window.addEventListener('load', () => {
            if (document.querySelectorAll('.tarjeta-periodo').length === 0) {
                agregarPeriodo(true);
            }
        });

        function agregarPeriodo(esPrimero = false) {
            contador++;
            const container = document.getElementById('lista-de-periodos');
            const hoy = new Date().toISOString().split('T')[0];
            
            const div = document.createElement('div');
            div.id = `periodo-bloque-${contador}`;
            div.className = "tarjeta-periodo";
            div.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-600">Periodo #${contador}</span>
                    ${!esPrimero ? `<button onclick="quitarPeriodo(${contador})" class="text-red-500 text-xs hover:underline">Eliminar</button>` : ''}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs text-gray-500">Tipo/Nombre</label>
                        <input type="text" id="nombre-${contador}" placeholder="Ej: Contrato Honorarios">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Fecha Inicio</label>
                        <input type="date" id="inicio-${contador}">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Fecha Término</label>
                        <input type="date" id="fin-${contador}" value="${esPrimero ? hoy : ''}">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function quitarPeriodo(id) {
            document.getElementById(`periodo-bloque-${id}`).remove();
        }

        function reiniciarCalculadora() {
            document.getElementById('lista-de-periodos').innerHTML = '';
            contador = 0;
            agregarPeriodo(true);
            document.getElementById('seccion-resultados').classList.add('hidden');
            document.getElementById('error-alerta').classList.add('hidden');
        }

        function realizarCalculo() {
            const errorAlerta = document.getElementById('error-alerta');
            const desglose = document.getElementById('desglose-individual');
            const bloqueTotal = document.getElementById('bloque-total');
            
            errorAlerta.classList.add('hidden');
            desglose.innerHTML = '<p class="text-sm font-bold text-gray-500 mb-2">Desglose por periodo:</p>';
            
            let sumaAnos = 0, sumaMeses = 0, sumaDias = 0;
            let error = false;

            const bloques = document.querySelectorAll('.tarjeta-periodo');
            
            bloques.forEach(bloque => {
                const id = bloque.id.replace('periodo-bloque-', '');
                const f1 = document.getElementById(`inicio-${id}`).value;
                const f2 = document.getElementById(`fin-${id}`).value;
                const nombre = document.getElementById(`nombre-${id}`).value || `Periodo ${id}`;

                if (!f1 || !f2) { error = true; return; }

                const d1 = new Date(f1 + 'T00:00:00');
                const d2 = new Date(f2 + 'T00:00:00');

                if (d1 > d2) { error = true; return; }

                let a = d2.getFullYear() - d1.getFullYear();
                let m = d2.getMonth() - d1.getMonth();
                let d = d2.getDate() - d1.getDate();

                if (d < 0) {
                    m--;
                    d += new Date(d2.getFullYear(), d2.getMonth(), 0).getDate();
                }
                if (m < 0) {
                    a--;
                    m += 12;
                }

                sumaAnos += a; sumaMeses += m; sumaDias += d;

                desglose.innerHTML += `
                    <div class="flex justify-between p-3 bg-gray-50 rounded border-l-4 border-emerald-500 text-sm">
                        <span class="font-medium">${nombre}</span>
                        <span>${a} años, ${m} meses, ${d} días</span>
                    </div>`;
            });

            if (error) {
                errorAlerta.textContent = "Error: Verifique que todas las fechas estén llenas y que la fecha de inicio no sea mayor a la de término.";
                errorAlerta.classList.remove('hidden');
                return;
            }

            // Normalización
            sumaMeses += Math.floor(sumaDias / 30);
            sumaDias = sumaDias % 30;
            sumaAnos += Math.floor(sumaMeses / 12);
            sumaMeses = sumaMeses % 12;

            bloqueTotal.innerHTML = `
                <p class="text-center text-xs font-bold uppercase tracking-widest mb-4 opacity-80">Tiempo Total Acumulado</p>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div><span class="text-5xl font-black">${sumaAnos}</span><br><small class="font-bold">AÑOS</small></div>
                    <div><span class="text-5xl font-black">${sumaMeses}</span><br><small class="font-bold">MESES</small></div>
                    <div><span class="text-5xl font-black">${sumaDias}</span><br><small class="font-bold">DÍAS</small></div>
                </div>`;
            
            document.getElementById('seccion-resultados').classList.remove('hidden');
        }
    </script>
</body>
</html>
